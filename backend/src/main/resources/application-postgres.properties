spring.flyway.enabled=true
spring.jooq.sql-dialect=POSTGRES
spring.autoconfigure.exclude=
filebonsai.access.cookie.secure=true
filebonsai.storage.local.root=${FILEBONSAI_STORAGE_ROOT:./data}
filebonsai.transfers.maximum-bytes=${FILEBONSAI_MAXIMUM_UPLOAD_BYTES:134217728}
filebonsai.transfers.maximum-duration=${FILEBONSAI_MAXIMUM_UPLOAD_DURATION:15m}
filebonsai.transfers.maximum-concurrent-writes=${FILEBONSAI_MAXIMUM_CONCURRENT_WRITES:4}
filebonsai.transfers.expiry=${FILEBONSAI_UPLOAD_EXPIRY:24h}
filebonsai.storage.provider=${FILEBONSAI_STORAGE_PROVIDER:local}
filebonsai.r2.account-id=${FILEBONSAI_R2_ACCOUNT_ID:}
filebonsai.r2.jurisdiction=${FILEBONSAI_R2_JURISDICTION:default}
filebonsai.r2.bucket=${FILEBONSAI_R2_BUCKET:}
filebonsai.r2.access-key-id-file=${FILEBONSAI_R2_ACCESS_KEY_ID_FILE:}
filebonsai.r2.secret-access-key-file=${FILEBONSAI_R2_SECRET_ACCESS_KEY_FILE:}
filebonsai.r2.api-call-timeout=${FILEBONSAI_R2_API_CALL_TIMEOUT:5m}
filebonsai.r2.cleanup-interval=${FILEBONSAI_R2_CLEANUP_INTERVAL:1h}
filebonsai.r2.recovery-idle=${FILEBONSAI_R2_RECOVERY_IDLE:30m}
filebonsai.r2.recovery-interval=${FILEBONSAI_R2_RECOVERY_INTERVAL:1m}
